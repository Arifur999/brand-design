schema_version: "1.1"
name: accounting-critique
expected_outcome: |
  A critique of the existing identity that checks measurable gates (contrast of the actual colours, font roles and licences, logo at small size and in one colour, distance from competitors), names category clichés and model defaults present (navy and gold, shield), gives findings per component with evidence, and ends with the three most important changes each stating exactly what, the measured effect, why, and the cost, without inventing facts.
